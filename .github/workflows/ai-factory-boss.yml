name: AI Factory - BOSS Watchdog

on:
  schedule:
    # Keep the existing twice-hourly BOSS cadence, but split 00:03 UTC so
    # exactly one run per day can also emit a low-noise CEO heartbeat.
    - cron: '3 0 * * *'
    - cron: '33 0 * * *'
    - cron: '3,33 1-23 * * *'
  workflow_dispatch:
  push:
    branches: ['claude/employee-onboarding-setup-udm86']
    paths:
      - '.github/workflows/ai-factory-boss.yml'
      - '.github/workflows/tomoki-manager.yml'
      - '.github/agents/ai-factory-boss.agent.md'
      - 'automation/control_plane/**'
      - 'docs/AI_COMPANY_SUPERVISION_CONTRACT.md'

permissions:
  contents: read
  actions: write

concurrency:
  group: ai-factory-boss-watchdog
  cancel-in-progress: false

jobs:
  boss:
    name: Watch MANAGER -> Recover -> Escalate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      CEO_REPORT_WEBHOOK_URL: ${{ secrets.CEO_REPORT_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: BOSS checks MANAGER and repairs first
        run: |
          python automation/control_plane/manager.py \
            --config automation/control_plane/boss_workers.json \
            --out reports/control-plane/boss-watchdog.json
          python automation/control_plane/boss_gate.py \
            reports/control-plane/boss-watchdog.json \
            --out reports/ceo-events/boss-watchdog.json

      - name: Publish BOSS evidence
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('reports/control-plane/boss-watchdog.json', encoding='utf-8'))
          s=d['summary']
          print('## AI FACTORY BOSS')
          print(f"- incidents={s['incidents']}")
          print(f"- recovery_actions={s['internal_recovery_actions']}")
          print(f"- recovering={s['recovering']}")
          print(f"- unresolved={s['unresolved']}")
          for row in d['workers']:
              print(f"- {row['name']}: {row['before']} -> {row['after']} / actions={row['actions']}")
          PY

      - name: Escalate only after internal recovery fails or P0 recovery matters
        shell: bash
        run: |
          SHOULD=$(python - <<'PY'
          import json
          d=json.load(open('reports/ceo-events/boss-watchdog.json',encoding='utf-8'))
          print('true' if d.get('should_report') else 'false')
          PY
          )
          if [[ "$SHOULD" == "true" && -n "${CEO_REPORT_WEBHOOK_URL:-}" ]]; then
            python automation/reporting/ceo_report.py reports/ceo-events/boss-watchdog.json
          fi

      - name: CEO daily heartbeat — alive, no duplicate operations
        if: github.event_name == 'schedule' && github.event.schedule == '3 0 * * *'
        shell: bash
        run: |
          if [[ -z "${CEO_REPORT_WEBHOOK_URL:-}" ]]; then
            echo "CEO heartbeat skipped: CEO_REPORT_WEBHOOK_URL is not configured." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          gate = json.load(open('reports/ceo-events/boss-watchdog.json', encoding='utf-8'))
          boss = json.load(open('reports/control-plane/boss-watchdog.json', encoding='utf-8'))
          summary = boss.get('summary') or {}
          owner_required = bool(gate.get('should_report'))
          now = datetime.now(ZoneInfo('Asia/Tokyo')).strftime('%Y-%m-%d %H:%M JST')
          owner_line = 'REQUIRED — final owner report emitted in this cycle' if owner_required else 'NONE'
          text = (
              '*CEO — DAILY HEARTBEAT*\n'
              f'生存=YES / BOSS cycle=OK / {now}\n'
              f"owner action={owner_line}\n"
              f"unresolved={int(summary.get('unresolved', 0) or 0)}\n"
              '通常業務の詳細はTOMOKI/MANAGER/BOSS内部に保持。CEOは重複報告しない。'
          )
          req = urllib.request.Request(
              os.environ['CEO_REPORT_WEBHOOK_URL'],
              data=json.dumps({'text': text}, ensure_ascii=False).encode('utf-8'),
              headers={'Content-Type': 'application/json'},
          )
          with urllib.request.urlopen(req, timeout=10) as res:
              if res.status < 200 or res.status >= 300:
                  raise RuntimeError(f'CEO heartbeat webhook HTTP {res.status}')
              print('CEO heartbeat delivered:', res.status)
          PY

      - name: Upload BOSS evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: ai-factory-boss-evidence
          retention-days: 30
          if-no-files-found: error
          path: |
            reports/control-plane/boss-watchdog.json
            reports/ceo-events/boss-watchdog.json
