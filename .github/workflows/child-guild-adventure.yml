name: THE WORLD - Child Guild Adventure

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

concurrency:
  group: child-guild-adventure
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Restore persistent Child Guild memory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/child-memory
          RUN_IDS="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "child-guild-adventure.yml" --status success --limit 20 --json databaseId --jq '.[].databaseId' || true)"
          MEMORY_RUN=""
          for run_id in $RUN_IDS; do
            rm -rf /tmp/child-memory/*
            if gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name child-guild-memory --dir /tmp/child-memory >/dev/null 2>&1; then
              if [[ -f /tmp/child-memory/child-guild-memory.json ]]; then
                MEMORY_RUN="$run_id"
                break
              fi
            fi
          done
          if [[ -n "$MEMORY_RUN" ]]; then
            cp /tmp/child-memory/child-guild-memory.json child-guild-memory.json
          else
            printf '{"schema":"child-guild-memory/v1","updated_at":null,"episodes":[],"child_counts":{},"action_counts":{},"adventure_counts":{},"genius_counts":{},"concept_counts":{},"recent_concepts":[],"observation_digests":[]}\n' > child-guild-memory.json
          fi
          echo "memory_source_run=${MEMORY_RUN:-fresh}" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore latest 50-child external fleet learning
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/child-fleet
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "THE WORLD - Child Guild External Fleet" --status success --limit 20 --json databaseId --jq '.[0].databaseId // empty' || true)"
          if [[ -n "$RUN_ID" ]]; then
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name child-external-fleet --dir /tmp/child-fleet || true
          fi
          FOUND="$(find /tmp/child-fleet -name child-external-fleet.json -print -quit || true)"
          if [[ -n "$FOUND" ]]; then cp "$FOUND" /tmp/child-external-fleet.json; fi
          echo "child_external_fleet_run=${RUN_ID:-none}" >> "$GITHUB_STEP_SUMMARY"

      - name: Pick one child and one memory-aware adventure
        run: |
          python company-society/playground_engine.py \
            --registry company-society/child_guild.json \
            --memory child-guild-memory.json \
            --seed "${{ github.run_id }}" \
            --json child-guild-adventure.json \
            --report child-guild-adventure.md
          cat child-guild-adventure.md >> "$GITHUB_STEP_SUMMARY"

      - name: Restore latest Outside World abstract R&D seed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/outside-rnd
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "Outside World Scout" --status success --limit 10 --json databaseId --jq '.[0].databaseId // empty' || true)"
          if [[ -n "$RUN_ID" ]]; then
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name outside-world-scout --dir /tmp/outside-rnd || true
          fi
          FOUND="$(find /tmp/outside-rnd -name outside-world-rnd-seed.json -print -quit || true)"
          if [[ -n "$FOUND" ]]; then cp "$FOUND" /tmp/outside-world-rnd-seed.json; fi
          echo "outside_world_run=${RUN_ID:-none}" >> "$GITHUB_STEP_SUMMARY"

      - name: Send three Child Fellows into the R&D lab
        shell: bash
        run: |
          set -euo pipefail
          outside=()
          if [[ -f /tmp/outside-world-rnd-seed.json ]]; then outside+=(--outside-seed /tmp/outside-world-rnd-seed.json); fi
          python value-lab/child_research_fellows.py \
            --registry company-society/child_guild.json \
            --queue value-lab/research_queue.json \
            --senju senju/state/last-evolution-summary.json \
            "${outside[@]}" \
            --seed "${{ github.run_id }}" \
            --out child-research-sparks.json \
            --report child-research-sparks.md
          cat child-research-sparks.md >> "$GITHUB_STEP_SUMMARY"

      - name: Learn from adventure, research, Outside World, and the 50-child fleet
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --memory child-guild-memory.json
            --packet child-guild-adventure.json
            --sparks child-research-sparks.json
            --out child-guild-memory.next.json
            --report child-guild-memory.md
          )
          if [[ -f /tmp/outside-world-rnd-seed.json ]]; then args+=(--observation /tmp/outside-world-rnd-seed.json); fi
          if [[ -f /tmp/child-external-fleet.json ]]; then args+=(--fleet /tmp/child-external-fleet.json); fi
          python company-society/child_memory.py "${args[@]}"
          mv child-guild-memory.next.json child-guild-memory.json
          cat child-guild-memory.md >> "$GITHUB_STEP_SUMMARY"

      - name: Test the playground, memory, and research boundaries
        run: |
          python -m unittest company-society/test_playground_engine.py -v
          python -m unittest company-society/test_child_memory.py -v
          python value-lab/test_child_research_fellows.py

      - name: Broadcast child guild findings externally
        shell: bash
        env:
          OUTBOUND_WEBHOOK_URL: ${{ secrets.OUTBOUND_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import json, os, subprocess, datetime
          from pathlib import Path

          sparks = {}
          if Path('child-research-sparks.json').exists():
              sparks = json.loads(Path('child-research-sparks.json').read_text())

          title = f"[Child Guild] Research sparks — {datetime.datetime.utcnow().strftime('%Y-%m-%d %H:%M')} UTC"
          fellows = sparks.get('fellows', [])
          body = f"**Run**: `{os.environ.get('GITHUB_RUN_ID', 'local')}`  \n"
          body += f"**Timestamp**: {datetime.datetime.utcnow().isoformat()}Z  \n\n"
          body += "### Child Fellows Research Sparks\n"
          for f in fellows[:5]:
              body += f"- **{f.get('name', '?')}**: {f.get('spark', f.get('title', '?'))}\n"
          if not fellows:
              body += "_No fellows data available this cycle._\n"
          body += f"\n<details><summary>Full payload</summary>\n\n```json\n{json.dumps(sparks, indent=2, ensure_ascii=False)[:3000]}\n```\n</details>"

          env = {**os.environ}
          result = subprocess.run(
              ["gh", "issue", "create",
               "--repo", os.environ.get("GITHUB_REPOSITORY", ""),
               "--title", title,
               "--body", body],
              capture_output=True, text=True, env=env
          )
          if result.returncode == 0:
              print(f"[child-broadcast] Issue: {result.stdout.strip()}")
          else:
              print(f"[child-broadcast] Issue failed: {result.stderr}")

          webhook = os.environ.get("OUTBOUND_WEBHOOK_URL", "").strip()
          if webhook:
              import urllib.request
              data = json.dumps({"source": "child-guild", "sparks": sparks}).encode()
              req = urllib.request.Request(webhook, data=data,
                  headers={"Content-Type": "application/json"}, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=10) as r:
                      print(f"[child-broadcast] Webhook status={r.status}")
              except Exception as e:
                  print(f"[child-broadcast] Webhook failed: {e}")
          PY

      - name: Preserve adventure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: child-guild-adventure-${{ github.run_id }}
          path: |
            child-guild-adventure.md
            child-guild-adventure.json
            child-research-sparks.md
            child-research-sparks.json
            child-guild-memory.md
          retention-days: 30
          if-no-files-found: warn

      - name: Preserve persistent Child Guild memory
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: child-guild-memory
          path: |
            child-guild-memory.json
            child-guild-memory.md
          retention-days: 90
          if-no-files-found: error

      - name: Preserve latest research sparks for R&D
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: child-research-sparks
          path: |
            child-research-sparks.md
            child-research-sparks.json
          retention-days: 30
          if-no-files-found: error

      - name: Tell TOMOKI what the kids picked and learned
        if: always()
        env:
          TOMOKI_SLACK_WEBHOOK_URL: ${{ secrets.TOMOKI_SLACK_WEBHOOK_URL }}
        run: |
          if [[ ! -f child-guild-adventure.md ]]; then
            printf '# THE WORLD — Child Guild\n\nAdventure generation failed.\n' > child-guild-adventure.md
          fi
          if [[ -f child-research-sparks.md ]]; then
            printf '\n\n---\n\n' >> child-guild-adventure.md
            cat child-research-sparks.md >> child-guild-adventure.md
          fi
          if [[ -f child-guild-memory.md ]]; then
            printf '\n\n---\n\n' >> child-guild-adventure.md
            cat child-guild-memory.md >> child-guild-adventure.md
          fi
          python tomoki-agents/slack_post.py \
            --agent "CHILD-GUILD" \
            --file child-guild-adventure.md \
            --status "${{ job.status }}"
