name: THE WORLD - Child Guild External Fleet

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
  pull_request:
    branches: ["claude/employee-onboarding-setup-udm86"]
    paths:
      - "company-society/child_external_fleet.py"
      - "company-society/test_child_external_fleet.py"
      - "company-society/control_variation_lab.py"
      - "company-society/test_control_variation_lab.py"
      - "value-lab/child_fleet_bridge.py"
      - "value-lab/test_child_fleet_bridge.py"
      - "value-lab/control_lab_bridge.py"
      - "value-lab/test_control_lab_bridge.py"
      - "outside-world/sources.json"
      - ".github/workflows/child-guild-external-fleet.yml"

concurrency:
  group: child-guild-external-fleet-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Restore latest Child Guild memory
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/child-memory
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "THE WORLD - Child Guild Adventure" --status success --limit 20 --json databaseId --jq '.[0].databaseId // empty' || true)"
          if [[ -n "$RUN_ID" ]]; then
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name child-guild-memory --dir /tmp/child-memory || true
          fi
          FOUND="$(find /tmp/child-memory -name child-guild-memory.json -print -quit || true)"
          if [[ -n "$FOUND" ]]; then
            cp "$FOUND" child-guild-memory.json
          else
            printf '{"schema":"child-guild-memory/v1","updated_at":null,"episodes":[],"child_counts":{},"action_counts":{},"adventure_counts":{},"genius_counts":{},"concept_counts":{},"recent_concepts":[],"observation_digests":[]}\n' > child-guild-memory.json
          fi
          echo "memory_source_run=${RUN_ID:-fresh}" >> "$GITHUB_STEP_SUMMARY"

      - name: Create fresh memory fixture for PR validation
        if: github.event_name == 'pull_request'
        run: |
          printf '{"schema":"child-guild-memory/v1","updated_at":null,"episodes":[],"child_counts":{},"action_counts":{},"adventure_counts":{},"genius_counts":{},"concept_counts":{},"recent_concepts":[],"observation_digests":[]}\n' > child-guild-memory.json

      - name: Run 50-child public external exploration fleet
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          python company-society/child_external_fleet.py \
            --registry company-society/child_guild.json \
            --sources outside-world/sources.json \
            --memory child-guild-memory.json \
            --seed "${{ github.run_id }}" \
            --max-workers 10 \
            --out child-external-fleet.json \
            --report child-external-fleet.md
          cat child-external-fleet.md >> "$GITHUB_STEP_SUMMARY"

      - name: Run 10x local control-friction learning
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          python company-society/control_variation_lab.py \
            --fleet child-external-fleet.json \
            --seed "${{ github.run_id }}" \
            --out child-control-lab.json \
            --report child-control-lab.md
          cat child-control-lab.md >> "$GITHUB_STEP_SUMMARY"

      - name: Embed transparent Control Lab summary into fleet handoff
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          fleet_path = Path('child-external-fleet.json')
          lab_path = Path('child-control-lab.json')
          fleet = json.loads(fleet_path.read_text(encoding='utf-8'))
          lab = json.loads(lab_path.read_text(encoding='utf-8'))
          summary = lab.get('summary') if isinstance(lab.get('summary'), dict) else {}
          fleet['control_lab_summary'] = {
              'trial_count': int(lab.get('trial_count', 0) or 0),
              'variants_per_child': int(lab.get('variants_per_child', 0) or 0),
              'top_high_score_strategies': list(summary.get('top_high_score_strategies') or [])[:6],
              'top_safe_transitions': list(summary.get('top_safe_transitions') or [])[:8],
              'research_hypothesis': str(summary.get('research_hypothesis', ''))[:320],
              'transport': 'transparent-research-context',
              'execution_authority': 'none',
          }
          fleet_path.write_text(json.dumps(fleet, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate fleet, control lab, and bridges
        run: |
          set -euo pipefail
          python -m unittest company-society/test_child_external_fleet.py -v
          python -m unittest company-society/test_control_variation_lab.py -v
          (cd value-lab && python -m unittest test_child_fleet_bridge.py test_control_lab_bridge.py -v)
          python -m py_compile \
            company-society/child_external_fleet.py \
            company-society/control_variation_lab.py \
            value-lab/child_fleet_bridge.py \
            value-lab/control_lab_bridge.py

      - name: Build R&D and Senju context capsules
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          python value-lab/child_fleet_bridge.py \
            --fleet child-external-fleet.json \
            --out reports/child-fleet-bridge
          python value-lab/control_lab_bridge.py \
            --lab child-control-lab.json \
            --out reports/control-lab-bridge
          cat reports/child-fleet-bridge/handoff.md >> "$GITHUB_STEP_SUMMARY"
          cat reports/control-lab-bridge/handoff.md >> "$GITHUB_STEP_SUMMARY"
          cat reports/child-fleet-bridge/handoff.md reports/control-lab-bridge/handoff.md > reports/child-fleet-bridge/combined-handoff.md

      - name: Preserve external fleet input and 10x learning
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: child-external-fleet
          retention-days: 30
          if-no-files-found: error
          path: |
            child-external-fleet.json
            child-external-fleet.md
            child-control-lab.json
            child-control-lab.md
            reports/child-fleet-bridge/rnd-capsule.json
            reports/child-fleet-bridge/senju-capsule.json
            reports/child-fleet-bridge/handoff.md
            reports/child-fleet-bridge/combined-handoff.md
            reports/control-lab-bridge/rnd-control-context.json
            reports/control-lab-bridge/senju-control-context.json
            reports/control-lab-bridge/handoff.md

      - name: Report fleet and control learning to TOMOKI
        if: github.event_name != 'pull_request'
        env:
          TOMOKI_SLACK_WEBHOOK_URL: ${{ secrets.TOMOKI_SLACK_WEBHOOK_URL }}
        run: |
          if [[ -n "${TOMOKI_SLACK_WEBHOOK_URL:-}" ]]; then
            python tomoki-agents/slack_post.py \
              --agent "CHILD-FLEET-50X10" \
              --file reports/child-fleet-bridge/combined-handoff.md \
              --status "${{ job.status }}"
          fi
