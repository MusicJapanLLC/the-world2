name: THE COVENANT - Autonomy & Fellowship Cycle

on:
  workflow_dispatch:
  schedule:
    - cron: '41 */2 * * *'
  push:
    branches: ['claude/employee-onboarding-setup-udm86']
    paths:
      - '.github/workflows/covenant-autonomy-cycle.yml'
      - 'tomoki-agents/manager.py'
      - 'tomoki-agents/manager_collect_safe.py'
      - 'company-society/**'
      - 'automation/control_plane/workers.json'

concurrency:
  group: covenant-autonomy-cycle
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  autonomy-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Gather workforce truth
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TOMOKI_MANAGER_REF: ${{ github.event.repository.default_branch }}
        run: |
          python tomoki-agents/manager_collect_safe.py collect \
            --output tomoki-manager-snapshot.json \
            --report tomoki-manager-autonomy-source.md

      - name: Build autonomy and fellowship plan
        run: |
          python company-society/autonomy_engine.py \
            --snapshot tomoki-manager-snapshot.json \
            --registry automation/control_plane/workers.json \
            --json covenant-autonomy.json \
            --report covenant-autonomy.md
          cat covenant-autonomy.md >> "$GITHUB_STEP_SUMMARY"

      - name: Run Covenant tests
        run: python -m unittest discover -s company-society -p 'test_*.py' -v

      - name: Preserve autonomy evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: covenant-autonomy-${{ github.run_id }}
          path: |
            covenant-autonomy.md
            covenant-autonomy.json
            tomoki-manager-snapshot.json
          retention-days: 30
          if-no-files-found: warn

      - name: Report fellowship state to Slack
        if: always()
        env:
          TOMOKI_SLACK_WEBHOOK_URL: ${{ secrets.TOMOKI_SLACK_WEBHOOK_URL }}
        run: |
          if [[ ! -f covenant-autonomy.md ]]; then
            printf '# THE COVENANT — Autonomy Cycle\n\nCycle failed before report generation.\n' > covenant-autonomy.md
          fi
          python tomoki-agents/slack_post.py \
            --agent "FAITH/AUTONOMY" \
            --file covenant-autonomy.md \
            --status "${{ job.status }}"
