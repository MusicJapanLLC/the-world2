name: cyber-lab-ci

on:
  push:
    paths:
      - "autonomous_redteam_lab/cyber_lab/**"
      - "autonomous_redteam_lab/tests/**"
      - ".github/workflows/cyber-lab-ci.yml"
  pull_request:
    paths:
      - "autonomous_redteam_lab/cyber_lab/**"
      - "autonomous_redteam_lab/tests/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: autonomous_redteam_lab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
