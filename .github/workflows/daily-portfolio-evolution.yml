    runs-on: ubuntu-latest
    needs: deploy
    if: success()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📈 Update portfolio metrics
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const god = JSON.parse(fs.readFileSync('automation/foundry_agents/god.json', 'utf8'));

            console.log('📊 Daily Update:');
            console.log('  Cycle:', god.globalState.cycleNumber);
            console.log('  Deployment:', new Date().toISOString());
            console.log('  Status: ✓ SUCCESS');
          "

