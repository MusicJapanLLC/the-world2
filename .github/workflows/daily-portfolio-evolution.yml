    runs-on: ubuntu-latest
    outputs:
      improvement_targets: ${{ steps.cycle.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: 🔮 THE WORLD GOD — Orchestration Phase
        id: cycle
        run: |
          echo "Starting autonomous orchestration..."
          node automation/foundry_agents/god.js cycle
          echo "targets=detected" >> $GITHUB_OUTPUT

      - name: 📊 Generate God Status Report
        run: node automation/foundry_agents/god.js status

      - name: 🧬 Evolution Analysis
        run: |
          echo "Analyzing cycle metrics and preparing for evolution..."
