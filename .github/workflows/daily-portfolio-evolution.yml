name: Daily Portfolio Evolution

on:
  schedule:
    - cron: '0 23 * * *'  # 23:00 UTC every day (6am JST)
  workflow_dispatch:
  push:
    branches: [claude/merge-and-fix-unmerged-nl45b3]

jobs:
