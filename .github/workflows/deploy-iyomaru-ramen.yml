name: Deploy Iyomaru Ramen site

on:
  push:
    branches: [claude/employee-onboarding-setup-udm86]
    paths:
      - "iyomaru-ramen/**"
      - ".github/workflows/deploy-iyomaru-ramen.yml"
  pull_request:
    branches: [claude/employee-onboarding-setup-udm86]
    paths:
      - "iyomaru-ramen/**"
      - ".github/workflows/deploy-iyomaru-ramen.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages-iyomaru-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: iyomaru-ramen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Build site
        env:
          SITE_URL: https://musicjapanllc.github.io
          SITE_BASE_PATH: /test/
        run: node build.mjs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: iyomaru-ramen/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
