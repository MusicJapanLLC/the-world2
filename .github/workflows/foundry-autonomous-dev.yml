name: Foundry Autonomous Dev Loop

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (show target only, no commit)"
        required: false
        default: false
        type: boolean

concurrency:
  group: foundry-autonomous-dev
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  dev-cycle:
    name: "Forge Cycle"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure git
        run: |
          git config user.email "forge@ai-foundry"
          git config user.name "AI FOUNDRY Bot"

      - name: Run dev loop (GitHub Models API)
        if: ${{ inputs.dry_run != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BASE_REF: "audit/reality-gate-v1"
          REPO_ROOT: ${{ github.workspace }}
        run: |
          python automation/foundry_agents/dev_loop.py 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Dry run — show top target only
        if: ${{ inputs.dry_run == 'true' }}
        env:
          REPO_ROOT: ${{ github.workspace }}
        run: |
          python3 -c "
          import json, pathlib, os
          root = pathlib.Path(os.getenv('REPO_ROOT', '.'))
          data = json.loads((root / 'automation/foundry_agents/improvement_targets.json').read_text())
          pending = [t for t in data['targets'] if t['status'] == 'pending']
          if not pending:
              print('All targets done!')
          else:
              t = max(pending, key=lambda x: x['priority'])
              print(f\"Top pending: [{t['id']}] {t['title']} (priority={t['priority']})\")
          "

      - name: Upload dev report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundry-dev-report-${{ github.run_id }}
          path: /tmp/foundry-dev-report.md
          if-no-files-found: ignore
          retention-days: 7
