name: Jules backlog dispatcher

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: jules-backlog-dispatch
  cancel-in-progress: false

jobs:
  dispatch-one:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Validate Senju autonomous delegation router
        run: |
          set -euo pipefail
          python -m pip install pytest==9.1.1
          (cd senju && python -m pytest tests/test_autonomy_delegate.py -q)

      - name: Convert latest Senju advisor decision into one coordinated Jules task
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/senju-memory /tmp/senju-selfdev

          RUN_ID="$(gh run list \
            --repo "$REPO" \
            --workflow "Senju Daily Self Evolution" \
            --status success \
            --limit 20 \
            --json databaseId \
            --jq '.[0].databaseId // empty' || true)"
          if [[ -n "$RUN_ID" ]]; then
            gh run download "$RUN_ID" \
              --repo "$REPO" \
              --name senju-memory \
              --dir /tmp/senju-memory || true
          fi

          # PR #252 is the owner of local lab self-development. Pull its latest
          # report into every cross-repo handoff so Jules can avoid duplicating
          # work already being generated by Senju itself.
          SELF_RUN="$(gh run list \
            --repo "$REPO" \
            --workflow "Senju Autonomous Self-Development Loop" \
            --status success \
            --limit 20 \
            --json databaseId \
            --jq '.[0].databaseId // empty' || true)"
          if [[ -n "$SELF_RUN" ]]; then
            gh run download "$SELF_RUN" \
              --repo "$REPO" \
              --name "senju-self-development-$SELF_RUN" \
              --dir /tmp/senju-selfdev || true
          fi

          SELF_REPORT="$(find /tmp/senju-selfdev -name self-code-gen-report.json -print -quit || true)"
          SELF_FP=""
          SELF_PR=""
          SELF_GENERATED="0"
          if [[ -n "$SELF_REPORT" ]]; then
            SELF_FP="$(jq -r '.campaign_fingerprint // ""' "$SELF_REPORT")"
            SELF_PR="$(jq -r '.pr // ""' "$SELF_REPORT")"
            SELF_GENERATED="$(jq -r '.generated_count // 0' "$SELF_REPORT")"
          fi
          echo "PR252 context run=${SELF_RUN:-none} generated=$SELF_GENERATED fingerprint=${SELF_FP:-none} pr=${SELF_PR:-none}"

          ADVISOR="$(find /tmp/senju-memory -name advisor-brief.json -print -quit || true)"
          if [[ -z "$ADVISOR" ]]; then
            echo "No Senju advisor evidence available; delegation skipped."
          else
            python senju/scripts/autonomy_delegate.py \
              --advisor "$ADVISOR" \
              --out /tmp/senju-delegation.json

            ROUTE="$(jq -r '.route' /tmp/senju-delegation.json)"
            KEY="$(jq -r '.delegation_key' /tmp/senju-delegation.json)"
            echo "Senju delegation route=$ROUTE key=$KEY source_run=${RUN_ID:-none}"

            if [[ "$ROUTE" == "jules" ]]; then
              EXISTING="$(gh issue list \
                --repo "$REPO" \
                --state all \
                --search "$KEY in:body" \
                --limit 10 \
                --json number \
                --jq '.[0].number // empty' || true)"
              if [[ -n "$EXISTING" ]]; then
                echo "Senju delegation already exists as issue #$EXISTING"
              else
                TITLE="$(jq -r '.title' /tmp/senju-delegation.json)"
                jq -r '.body' /tmp/senju-delegation.json > /tmp/senju-delegation-body.md
                cat >> /tmp/senju-delegation-body.md <<EOF

## PR #252 coordination context
- self-development run: ${SELF_RUN:-none}
- local manifests generated: ${SELF_GENERATED:-0}
- local plan fingerprint: ${SELF_FP:-none}
- local self-development PR: ${SELF_PR:-none}

If the requested change overlaps the local self-development PR above, do not duplicate it; adapt to the current default branch and leave the overlapping work to PR #252's lane.
EOF
                URL="$(gh issue create \
                  --repo "$REPO" \
                  --title "$TITLE" \
                  --body-file /tmp/senju-delegation-body.md)"
                echo "Senju autonomously delegated coordinated work to Jules: $URL"
              fi
            elif [[ "$ROUTE" == "self" ]]; then
              echo "Senju recommendation remains in PR #252/self implementation lanes."
            elif [[ "$ROUTE" == "hold" ]]; then
              echo "Senju recommendation touched a non-auto-expanding authority surface; no external authority was created."
            fi
          fi

      - name: Dispatch oldest undispatched Jules issue
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${JULES_API_KEY:-}" ]]; then
            echo "::error::JULES_API_KEY is not configured"
            exit 1
          fi

          gh_get() {
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$1"
          }

          comment() {
            local number="$1"
            local body="$2"
            jq -n --arg body "$body" '{body: $body}' |
              curl --fail --silent --show-error -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${REPO}/issues/$number/comments" \
                --data-binary @- >/dev/null
          }

          owner="${REPO%%/*}"
          repo="${REPO#*/}"
          sources_json="$(curl --fail-with-body --silent --show-error \
            -H "X-Goog-Api-Key: $JULES_API_KEY" \
            "https://jules.googleapis.com/v1alpha/sources")"
          source_name="$(jq -r --arg owner "$owner" --arg repo "$repo" \
            '.sources[]? | select(.githubRepo.owner == $owner and .githubRepo.repo == $repo) | .name' \
            <<<"$sources_json" | head -n 1)"

          if [[ -z "$source_name" ]]; then
            echo "::error::$REPO is not configured as a Jules source"
            exit 1
          fi

          issues_json="$(gh_get "https://api.github.com/repos/${REPO}/issues?state=open&per_page=100&sort=created&direction=asc")"
          candidate=""

          while IFS= read -r number; do
            comments="$(gh_get "https://api.github.com/repos/${REPO}/issues/$number/comments?per_page=100")"
            last_jules_event="$(jq -r '[.[] | select(((.body // "") | startswith("Julesを起動しました")) or ((.body // "") | startswith("Julesセッションが終了しました"))) | .body] | last // ""' <<<"$comments")"
            if [[ "$last_jules_event" == Julesを起動しました* ]]; then
              continue
            fi
            candidate="$number"
            break
          done < <(jq -r '.[] | select(.pull_request == null) | select((((.title // "") | startswith("[Jules]")) or (((.title // "") | startswith("[jules]"))))) | .number' <<<"$issues_json")

          if [[ -z "$candidate" ]]; then
            echo "No undispatched [Jules] issues in backlog."
            exit 0
          fi

          issue="$(gh_get "https://api.github.com/repos/${REPO}/issues/$candidate")"
          title="$(jq -r '.title' <<<"$issue")"
          body="$(jq -r '.body // ""' <<<"$issue")"
          url="$(jq -r '.html_url' <<<"$issue")"
          prompt="$(jq -nr --arg title "$title" --arg body "$body" --arg url "$url" '$title + "\n\n" + $body + "\n\nSource issue: " + $url + "\n\nImplement the task, run relevant tests, and open a pull request. Do not push directly to the starting branch."')"
          request="$(jq -n --arg prompt "$prompt" --arg source "$source_name" --arg branch "$DEFAULT_BRANCH" '{prompt:$prompt,title:("GitHub Issue: " + ($prompt | split("\n")[0])),sourceContext:{source:$source,githubRepoContext:{startingBranch:$branch}},requirePlanApproval:false,automationMode:"AUTO_CREATE_PR"}')"

          response_file="$(mktemp)"
          http_code="$(curl --silent --show-error -o "$response_file" -w '%{http_code}' -X POST \
            -H "Content-Type: application/json" \
            -H "X-Goog-Api-Key: $JULES_API_KEY" \
            "https://jules.googleapis.com/v1alpha/sessions" \
            --data-binary "$request")"

          if [[ "$http_code" != "200" && "$http_code" != "201" ]]; then
            echo "Jules session creation deferred for issue #$candidate (HTTP $http_code); retrying on a later cycle."
            exit 0
          fi

          session_name="$(jq -r '.name // empty' <"$response_file")"
          session_id="$(jq -r '.id // empty' <"$response_file")"
          session_url="$(jq -r '.url // empty' <"$response_file")"
          if [[ -z "$session_name" ]]; then
            echo "Jules response had no session name; keeping issue queued."
            exit 0
          fi

          if [[ -n "$session_url" ]]; then
            comment "$candidate" "Julesを起動しました\n\n- Session: $session_id\n- Status: running\n- Console: $session_url\n- Dispatcher: backlog"
          else
            comment "$candidate" "Julesを起動しました\n\n- Session: $session_id\n- Status: running\n- Dispatcher: backlog"
          fi
          echo "Started Jules session $session_id for issue #$candidate"
