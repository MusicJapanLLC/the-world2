name: Owned Self-Recovery Worker

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - META Production Stop Learning
    types:
      - completed

permissions:
  contents: read
  actions: write
  issues: read

concurrency:
  group: owned-self-recovery-worker
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Restore META runtime state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: senju/state/
          key: senju-adversary-damage-${{ github.ref_name }}
          restore-keys: |
            senju-adversary-damage-

      - name: Load durable META/X worker registrations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          from pathlib import Path

          token = os.environ['GITHUB_TOKEN']
          repo = os.environ['GITHUB_REPOSITORY']
          owner, name = repo.split('/', 1)
          query = urllib.parse.urlencode({
              'state': 'open',
              'labels': 'meta-x-recovery-worker',
              'per_page': '100',
          })
          url = f'https://api.github.com/repos/{owner}/{name}/issues?{query}'
          req = urllib.request.Request(url, headers={
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          workers = []
          try:
              with urllib.request.urlopen(req, timeout=15) as r:
                  rows = json.loads(r.read() or b'[]')
              for issue in rows:
                  if 'pull_request' in issue:
                      continue
                  body = issue.get('body')
                  if not isinstance(body, str):
                      continue
                  try:
                      item = json.loads(body)
                  except json.JSONDecodeError:
                      continue
                  if isinstance(item, dict):
                      item['_registration_issue'] = issue.get('number')
                      workers.append(item)
          except Exception as exc:
              print(f'durable registration fetch failed: {exc}')
          Path('/tmp/dynamic-workers.json').write_text(
              json.dumps({'workers': workers}, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(f'durable META/X workers loaded: {len(workers)}')
          PY

      - name: Load learned production recovery tuning
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          from pathlib import Path

          token = os.environ['GITHUB_TOKEN']
          repo = os.environ['GITHUB_REPOSITORY']
          owner, name = repo.split('/', 1)
          query = urllib.parse.urlencode({
              'state': 'open',
              'labels': 'meta-stop-learning-state',
              'per_page': '100',
          })
          url = f'https://api.github.com/repos/{owner}/{name}/issues?{query}'
          req = urllib.request.Request(url, headers={
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          tuning = {'enabled': False, 'active_controls': [], 'max_dispatches_per_run': 0, 'stale_after_multiplier': 1.0}
          try:
              with urllib.request.urlopen(req, timeout=15) as r:
                  rows = json.loads(r.read() or b'[]')
              for issue in rows:
                  if issue.get('title') != '[THE-WORLD] Production Stop Learning State':
                      continue
                  try:
                      state = json.loads(issue.get('body') or '{}')
                  except json.JSONDecodeError:
                      state = {}
                  candidate = state.get('recovery_tuning')
                  if isinstance(candidate, dict):
                      tuning = candidate
                  break
          except Exception as exc:
              print(f'production recovery tuning fetch failed: {exc}')
          Path('/tmp/recovery-tuning.json').write_text(
              json.dumps(tuning, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print('learned recovery tuning:', json.dumps(tuning, ensure_ascii=False))
          PY

      - name: Apply learned tuning to runtime recovery inputs
        run: |
          python automation/recovery/apply_recovery_tuning.py \
            --registry automation/recovery/approved_persistence_registry.json \
            --tuning /tmp/recovery-tuning.json \
            --dynamic-workers /tmp/dynamic-workers.json \
            --out-registry /tmp/tuned-recovery-registry.json \
            --out-dynamic /tmp/tuned-dynamic-workers.json

      - name: Build recovery plan
        run: |
          python automation/recovery/approved_persistence.py \
            --registry /tmp/tuned-recovery-registry.json \
            --dynamic-workers /tmp/tuned-dynamic-workers.json \
            --out /tmp/self-recovery-plan.json

      - name: Dispatch approved recovery recipes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          plan = json.loads(Path('/tmp/self-recovery-plan.json').read_text())
          if plan.get('unknown_system_installation') is not False:
              raise SystemExit('refusing plan that permits unknown-system installation')
          if plan.get('same_repository_only') is not True:
              raise SystemExit('refusing cross-repository recovery plan')

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          owner, name = repo.split('/', 1)
          actions = plan.get('actions', [])
          print(f'approved recovery actions: {len(actions)}')

          for action in actions:
              if action.get('provider') != 'github_actions' or action.get('action') != 'workflow_dispatch':
                  print('skip unsupported action', action.get('worker_id'))
                  continue
              workflow = str(action['workflow'])
              ref = str(action['ref'])
              encoded = urllib.parse.quote(workflow, safe='')
              url = f'https://api.github.com/repos/{owner}/{name}/actions/workflows/{encoded}/dispatches'
              payload = json.dumps({'ref': ref, 'inputs': {}}).encode()
              req = urllib.request.Request(
                  url,
                  data=payload,
                  method='POST',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=15) as response:
                      selected = action.get('selected_by', 'static-owner-registry')
                      print(f"recovery dispatched: {action['worker_id']} -> {workflow} ({response.status}) selected_by={selected}")
              except urllib.error.HTTPError as exc:
                  print(f"recovery dispatch failed: {action['worker_id']} -> {workflow}: HTTP {exc.code}")
          PY

      - name: Preserve recovery plan
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: owned-self-recovery-plan-${{ github.run_id }}
          path: |
            /tmp/self-recovery-plan.json
            /tmp/dynamic-workers.json
            /tmp/recovery-tuning.json
            /tmp/tuned-recovery-registry.json
            /tmp/tuned-dynamic-workers.json
          if-no-files-found: ignore
          retention-days: 7
