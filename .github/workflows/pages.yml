# Baton は Vercel で配信する。これは予備の経路。
# 自動実行せず、必要時だけ手動で使う。
name: Deploy Baton to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-baton
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: baton/package-lock.json

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Resolve base path
        run: |
          RAW='${{ steps.pages.outputs.base_path }}/'
          echo "VITE_BASE=$(echo "$RAW" | sed 's://*:/:g')" >> "$GITHUB_ENV"

      - name: Install
        working-directory: baton
        run: npm ci

      - name: Build
        working-directory: baton
        env:
          VITE_SITE_URL: ${{ steps.pages.outputs.origin }}
          VITE_GAS_ENDPOINT: ${{ secrets.VITE_GAS_ENDPOINT }}
          VITE_GA4_ID: ${{ secrets.VITE_GA4_ID }}
          VITE_META_PIXEL_ID: ${{ secrets.VITE_META_PIXEL_ID }}
        run: npm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: baton/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
