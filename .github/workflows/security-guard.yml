name: Security Guard

on:
  push:
    branches: ["claude/employee-onboarding-setup-udm86"]
  pull_request:
    branches: ["claude/employee-onboarding-setup-udm86"]
  workflow_dispatch:
  schedule:
    - cron: "23 1 * * 1"

permissions:
  contents: read

concurrency:
  group: security-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Block tracked secret files
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files | grep -E '(^|/)(\.env($|\..*)|\.npmrc$|\.pypirc$|\.netrc$|credentials\.json$|token\.json$|client_secret[^/]*\.json$|service-account[^/]*\.json$|firebase-adminsdk[^/]*\.json$|.*\.(pem|key|p12|pfx|kdbx)$|id_rsa$|id_ed25519$)' | grep -vE '(^|/)\.env\.example$' || true)"
          if [[ -n "$forbidden" ]]; then
            echo "Forbidden secret-bearing files are tracked:"
            echo "$forbidden"
            exit 1
          fi

      - name: Block obvious credential material in tracked source
        shell: bash
        run: |
          set -euo pipefail
          patterns='-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|(^|[^A-Za-z0-9])sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{30,}|xox[baprs]-[0-9A-Za-z-]{20,}|AKIA[0-9A-Z]{16}|sk_live_[0-9A-Za-z]{16,}|SG\.[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}|https://hooks\.slack\.com/services/[A-Za-z0-9/_-]{20,}'
          # This existing adversary module intentionally contains synthetic key fixtures.
          # It stays covered by the diff-only scanner below, so newly introduced secrets
          # in that file still fail CI while the known baseline fixture does not self-trip.
          if git grep -I -nE -e "$patterns" -- ':!*.md' ':!*.example' ':!.github/workflows/security-guard.yml' ':!senju/senju/multiguard_adversary_v2.py'; then
            echo "Potential credential material found in tracked source."
            exit 1
          fi

      - name: Scan newly introduced lines for secrets
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          patterns='-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|(^|[^A-Za-z0-9])sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{30,}|xox[baprs]-[0-9A-Za-z-]{20,}|AKIA[0-9A-Z]{16}|sk_live_[0-9A-Za-z]{16,}|SG\.[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}|https://hooks\.slack\.com/services/[A-Za-z0-9/_-]{20,}'
          diff_file="$(mktemp)"
          if [[ "$EVENT_NAME" == "pull_request" && -n "${BASE_SHA:-}" && -n "${PR_HEAD_SHA:-}" ]]; then
            git diff --unified=0 "$BASE_SHA...$PR_HEAD_SHA" -- . ':!.github/workflows/security-guard.yml' > "$diff_file"
          elif [[ "$EVENT_NAME" == "push" && -n "${BEFORE_SHA:-}" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            git diff --unified=0 "$BEFORE_SHA" "$CURRENT_SHA" -- . ':!.github/workflows/security-guard.yml' > "$diff_file"
          else
            git show --format= --unified=0 "$CURRENT_SHA" -- . ':!.github/workflows/security-guard.yml' > "$diff_file" || true
          fi
          if grep '^+' "$diff_file" | grep -v '^+++' | grep -E -- "$patterns"; then
            echo "Potential secret introduced by this change."
            exit 1
          fi

      # Run the focused real-surface regression before repository-wide policy checks.
      # Later gates still fail closed; this ordering only ensures this PR's focused
      # evidence is produced even when unrelated pre-existing workflow drift exists.
      - name: Run real-surface adversary regression
        run: PYTHONPATH=senju python -m senju.real_surface_adversary --json reports/security/real-surface-adversary.json

      - name: Enforce fail-closed workflow policy
        run: python automation/security/workflow_policy_entrypoint.py

      - name: Enforce external-evidence reality gate
        run: python automation/security/reality_gate.py

      - name: Block remote shell execution patterns
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE '(curl|wget).*(\|[[:space:]]*(bash|sh))|(bash|sh|source)[[:space:]]*<\([[:space:]]*(curl|wget)' .github/workflows --exclude='security-guard.yml'; then
            echo "Remote content is being executed directly as shell code."
            exit 1
          fi

      - name: Block direct interpolation of untrusted event text
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE '\$\{\{[[:space:]]*github\.event\.(issue|comment|pull_request)\.(title|body)' .github/workflows --exclude='security-guard.yml'; then
            echo "Untrusted event text is directly interpolated into a workflow."
            exit 1
          fi
