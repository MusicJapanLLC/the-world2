name: Senju - Authorized Range Assault

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches:
      - claude/employee-onboarding-setup-udm86
    paths:
      - 'senju/scripts/authorized_range_assault.py'
      - 'senju/config/authorized-test-federation.json'
      - 'senju/config/authorized-test-federation-broadcast.json'
      - 'automation/codegen/meta_state/authorized_test_federation.json'
      - '.github/workflows/senju-authorized-range-assault.yml'

permissions:
  contents: read

concurrency:
  group: senju-authorized-range-assault
  cancel-in-progress: true

jobs:
  exercise:
    name: Repeated adversarial exercise of fixed authorized range
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Run Senju authorized adversarial exercise
        working-directory: senju
        run: python scripts/authorized_range_assault.py

      - name: Publish sanitized findings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: senju-authorized-range-assault-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: senju/authorized-range-assault-report.json
