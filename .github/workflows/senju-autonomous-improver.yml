name: Senju GitHub Native Autonomous Improver

on:
  schedule:
    - cron: "30 22 * * *" # 07:30 JST, after R&D coupling at 07:20
  workflow_dispatch:
  push:
    branches: ["claude/employee-onboarding-setup-udm86"]
    paths:
      - ".github/workflows/senju-autonomous-improver.yml"
      - ".github/workflows/rnd-senju-coupled-loop.yml"
      - ".github/workflows/covenant-autonomy-cycle.yml"
      - ".github/workflows/senju-live-observation-arena.yml"
      - "senju/scripts/github_native_improver.py"
      - "senju/scripts/shadow_league.py"
      - "senju/scripts/shadow_selector.py"
      - "senju/scripts/apply_rnd_directive.py"
      - "senju/scripts/apply_covenant_intent.py"
      - "senju/tests/test_covenant_intent.py"
      - "company-society/**"
      - "value-lab/**"

concurrency:
  group: senju-github-native-autonomous-improver
  cancel-in-progress: false

jobs:
  propose-and-validate:
    name: COVENANT intent + R&D -> evidence -> shadow league -> holdout
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Restore latest Senju memory artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/senju-memory
          PREV_RUN="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "Senju Daily Self Evolution" --status success --limit 10 --json databaseId --jq '.[0].databaseId // empty' || true)"
          if [[ -n "$PREV_RUN" ]]; then
            gh run download "$PREV_RUN" --repo "$GITHUB_REPOSITORY" --name senju-memory --dir /tmp/senju-memory || true
          fi
          if [[ -f /tmp/senju-memory/strategy.next.json ]]; then
            cp /tmp/senju-memory/strategy.next.json /tmp/base-strategy.json
          else
            cp senju/state/strategy.json /tmp/base-strategy.json
          fi
          if [[ -f /tmp/senju-memory/state.next.json ]]; then
            cp /tmp/senju-memory/state.next.json /tmp/champion.json
          else
            cp senju/state/champion.json /tmp/champion.json
          fi
          if [[ -f /tmp/senju-memory/evolution-summary.json ]]; then
            cp /tmp/senju-memory/evolution-summary.json /tmp/evolution-summary.json
          else
            printf '{}\n' > /tmp/evolution-summary.json
          fi

      - name: Restore latest R&D research directive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rnd-senju
          RND_RUN="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "R&D x Senju Coupled Loop" --status success --limit 10 --json databaseId --jq '.[0].databaseId // empty' || true)"
          if [[ -n "$RND_RUN" ]]; then
            gh run download "$RND_RUN" --repo "$GITHUB_REPOSITORY" --name rnd-senju-exchange --dir /tmp/rnd-senju || true
          fi
          DIRECTIVE="$(find /tmp/rnd-senju -name directive.json -print -quit || true)"
          if [[ -n "$DIRECTIVE" ]]; then
            cp "$DIRECTIVE" /tmp/rnd-directive.json
            echo "R&D directive restored from run $RND_RUN" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No prior R&D artifact; building current bounded directive from repository queue." >> "$GITHUB_STEP_SUMMARY"
            python value-lab/senju_bridge.py \
              --queue value-lab/research_queue.json \
              --senju senju/state/last-evolution-summary.json \
              --out /tmp/current-rnd
            cp /tmp/current-rnd/directive.json /tmp/rnd-directive.json
          fi

      - name: Restore latest COVENANT autonomy intent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/covenant-artifact
          COV_RUN="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "THE COVENANT - Autonomy & Fellowship Cycle" --status success --limit 10 --json databaseId --jq '.[0].databaseId // empty' || true)"
          if [[ -n "$COV_RUN" ]]; then
            gh run download "$COV_RUN" --repo "$GITHUB_REPOSITORY" --dir /tmp/covenant-artifact || true
          fi
          COVENANT="$(find /tmp/covenant-artifact -name covenant-autonomy.json -print -quit || true)"
          if [[ -n "$COVENANT" ]]; then
            cp "$COVENANT" /tmp/covenant-autonomy.json
            echo "COVENANT intent restored from run $COV_RUN" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No prior COVENANT artifact; building a fresh bounded autonomy plan." >> "$GITHUB_STEP_SUMMARY"
            python tomoki-agents/manager_collect_safe.py collect \
              --output /tmp/covenant-snapshot.json \
              --report /tmp/covenant-source.md
            python company-society/autonomy_engine.py \
              --snapshot /tmp/covenant-snapshot.json \
              --registry automation/control_plane/workers.json \
              --json /tmp/covenant-autonomy.json \
              --report /tmp/covenant-autonomy.md
          fi

      - name: Restore latest real-observation evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/live-observation-artifact
          LIVE_RUN="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "Senju Live Observation Arena" --status success --limit 10 --json databaseId --jq '.[0].databaseId // empty' || true)"
          if [[ -n "$LIVE_RUN" ]]; then
            gh run download "$LIVE_RUN" --repo "$GITHUB_REPOSITORY" --name senju-live-observation-arena-evidence --dir /tmp/live-observation-artifact || true
          fi
          LIVE="$(find /tmp/live-observation-artifact -name evidence.json -print -quit || true)"
          if [[ -n "$LIVE" ]]; then
            cp "$LIVE" /tmp/live-observation.json
            echo "Reality evidence restored from run $LIVE_RUN" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No prior reality evidence; COVENANT adapter will force VERIFY_DEEPLY." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run engine and guard tests before proposal
        working-directory: senju
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        run: |
          set -euo pipefail
          python -m pip install pytest==9.1.1
          python -m pytest tests -q
          python -m senju.cli safety-check sim://ci-target
          if python -m senju.cli safety-check 8.8.8.8; then exit 1; fi
          if python -m senju.cli safety-check https://example.com; then exit 1; fi

      - name: Select next strategy from measured evaluator evidence
        run: |
          set -euo pipefail
          python senju/scripts/github_native_improver.py \
            --strategy /tmp/base-strategy.json \
            --evolution-summary /tmp/evolution-summary.json \
            --output-dir /tmp/promotion

      - name: Apply bounded R&D research focus to Senju proposal
        run: |
          set -euo pipefail
          cp /tmp/promotion/strategy.json /tmp/pre-rnd-strategy.json
          python -m senju.scripts.apply_rnd_directive \
            --strategy /tmp/promotion/strategy.json \
            --directive /tmp/rnd-directive.json \
            --out /tmp/rnd-strategy.json \
            --audit /tmp/rnd-applied.json
          cp /tmp/rnd-strategy.json /tmp/promotion/strategy.json
          python - <<'PY'
          import json
          from pathlib import Path
          summary=json.loads(Path('/tmp/promotion/last-evolution-summary.json').read_text())
          applied=json.loads(Path('/tmp/rnd-applied.json').read_text())
          strategy=json.loads(Path('/tmp/promotion/strategy.json').read_text())
          summary['rnd_coupling']=applied
          summary['next_strategy']=strategy
          summary['changes']=(summary.get('changes') or []) + [
              f"R&D/{applied['focus']} {k}: {v['before']} -> {v['after']}"
              for k,v in applied.get('changes',{}).items()
          ]
          Path('/tmp/promotion/last-evolution-summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2)+'\n')
          PY
          cat /tmp/rnd-applied.json >> "$GITHUB_STEP_SUMMARY"

      - name: Apply COVENANT LIMITLESS intent to bounded Senju search
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --strategy /tmp/promotion/strategy.json
            --covenant /tmp/covenant-autonomy.json
            --out /tmp/covenant-strategy.json
            --audit /tmp/covenant-intent.json
          )
          if [[ -f /tmp/live-observation.json ]]; then
            args+=(--live /tmp/live-observation.json)
          fi
          python senju/scripts/apply_covenant_intent.py "${args[@]}"
          cp /tmp/covenant-strategy.json /tmp/promotion/strategy.json
          python - <<'PY'
          import json
          from pathlib import Path
          summary=json.loads(Path('/tmp/promotion/last-evolution-summary.json').read_text())
          applied=json.loads(Path('/tmp/covenant-intent.json').read_text())
          strategy=json.loads(Path('/tmp/promotion/strategy.json').read_text())
          summary['covenant_intent']=applied
          summary['next_strategy']=strategy
          summary['changes']=(summary.get('changes') or []) + [
              f"COVENANT/{applied['intent_mode']} {k}: {v['before']} -> {v['after']}"
              for k,v in applied.get('changes',{}).items()
          ]
          Path('/tmp/promotion/last-evolution-summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2)+'\n')
          PY
          cat /tmp/covenant-intent.json >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce autonomous promotion allowlist
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          allowed = {
              'population': (40, 240),
              'generations': (6, 40),
              'matches': (100, 1200),
              'mutation_rate': (0.05, 0.35),
              'red_budget': (6, 24),
              'blue_budget': (6, 24),
              'seed': (1, 2147483647),
          }
          s = json.loads(Path('/tmp/promotion/strategy.json').read_text())
          assert set(s) == set(allowed), set(s)
          for k, (lo, hi) in allowed.items():
              assert lo <= float(s[k]) <= hi, (k, s[k])
          summary = json.loads(Path('/tmp/promotion/last-evolution-summary.json').read_text())
          assert summary.get('safe') is True
          forbidden = ('target', 'scope', 'network', 'permission', 'secret', 'credential', 'workflow', 'url', 'host')
          evidence_fields = {
              'engine': summary.get('engine'),
              'safe': summary.get('safe'),
              'confidence': summary.get('confidence'),
              'changes': summary.get('changes'),
              'previous_strategy': summary.get('previous_strategy'),
              'next_strategy': summary.get('next_strategy'),
              'rnd_coupling': summary.get('rnd_coupling'),
              'covenant_intent': summary.get('covenant_intent'),
          }
          text = json.dumps(evidence_fields, ensure_ascii=False).lower()
          for word in forbidden:
              if word in text:
                  raise SystemExit(f'forbidden autonomous surface referenced: {word}')
          PY
          cp /tmp/champion.json /tmp/promotion/champion.json
          find /tmp/promotion -maxdepth 1 -type f -printf '%f\n' | sort > /tmp/files.txt
          printf '%s\n' champion.json last-evolution-plan.md last-evolution-summary.json strategy.json | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/files.txt

      - name: Smoke-test R&D and COVENANT shaped strategy
        working-directory: senju
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          s=json.load(open('/tmp/promotion/strategy.json'))
          c=json.load(open('/tmp/covenant-intent.json'))
          candidates=max(3,min(5,int(c.get('candidate_count',3))))
          cmd=['python','-m','senju.autopilot','--state','/tmp/promotion/champion.json','--out','/tmp/verify','--population',str(s['population']),'--generations',str(min(s['generations'],8)),'--matches',str(min(s['matches'],250)),'--candidates',str(candidates)]
          subprocess.run(cmd, check=True)
          d=json.load(open('/tmp/verify/evolution-summary.json'))
          if not d['selected']['safe']:
              raise SystemExit('candidate smoke evaluation was unsafe')
          PY

      - name: Run multi-candidate Shadow Champion selection and unseen holdout
        working-directory: senju
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATES="$(python - <<'PY'
          import json
          rnd=max(3,min(9,int(json.load(open('/tmp/rnd-applied.json')).get('candidate_count',7))))
          cov=max(3,min(9,int(json.load(open('/tmp/covenant-intent.json')).get('candidate_count',7))))
          print(max(rnd,cov))
          PY
          )"
          python -m scripts.shadow_selector \
            --state /tmp/promotion/champion.json \
            --strategy /tmp/promotion/strategy.json \
            --out /tmp/promotion-shadow \
            --selected /tmp/shadow-selected-strategy.json \
            --candidates "$CANDIDATES"
          cp /tmp/shadow-selected-strategy.json /tmp/promotion/strategy.json
          python - <<'PY'
          import json
          from pathlib import Path
          summary=json.loads(Path('/tmp/promotion/last-evolution-summary.json').read_text())
          selection=json.loads(Path('/tmp/promotion-shadow/selection.json').read_text())
          strategy=json.loads(Path('/tmp/promotion/strategy.json').read_text())
          summary['shadow_champion']={
              'selected': selection.get('selected'),
              'reason': selection.get('reason'),
              'candidate_count': selection.get('candidate_count'),
              'holdout': selection.get('holdout'),
          }
          summary['next_strategy']=strategy
          Path('/tmp/promotion/last-evolution-summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2)+'\n')
          PY
          cat /tmp/promotion-shadow/selection.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validated promotion bundle
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: senju-validated-promotion
          retention-days: 14
          if-no-files-found: error
          path: |
            /tmp/promotion/champion.json
            /tmp/promotion/strategy.json
            /tmp/promotion/last-evolution-summary.json
            /tmp/promotion/last-evolution-plan.md

      - name: Upload COVENANT R&D and Shadow selection evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: senju-prepromotion-shadow
          retention-days: 30
          if-no-files-found: error
          path: |
            /tmp/rnd-directive.json
            /tmp/rnd-applied.json
            /tmp/covenant-autonomy.json
            /tmp/covenant-intent.json
            /tmp/live-observation.json
            /tmp/promotion-shadow/selection.json
            /tmp/promotion-shadow/selection.md

  promote:
    name: State-only branch -> verify diff -> fast-forward promote
    needs: propose-and-validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download validated promotion bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: senju-validated-promotion
          path: /tmp/promotion

      - name: Create state-only branch, verify allowed diff, and fast-forward promote
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          BASE="$(gh repo view "$REPO" --json defaultBranchRef --jq '.defaultBranchRef.name')"
          BASE_SHA="$(gh api "repos/$REPO/git/ref/heads/$BASE" --jq '.object.sha')"
          BRANCH="senju/auto-promote-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh api -X POST "repos/$REPO/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$BASE_SHA" >/dev/null

          put_file() {
            local src="$1" path="$2" sha content
            content="$(base64 -w0 "$src")"
            sha="$(gh api "repos/$REPO/contents/$path?ref=$BRANCH" --jq '.sha' 2>/dev/null || true)"
            if [[ -n "$sha" ]]; then
              gh api -X PUT "repos/$REPO/contents/$path" -f message="chore(senju): promote validated autonomous state [run $GITHUB_RUN_ID]" -f content="$content" -f branch="$BRANCH" -f sha="$sha" >/dev/null
            else
              gh api -X PUT "repos/$REPO/contents/$path" -f message="chore(senju): promote validated autonomous state [run $GITHUB_RUN_ID]" -f content="$content" -f branch="$BRANCH" >/dev/null
            fi
          }

          put_file /tmp/promotion/champion.json senju/state/champion.json
          put_file /tmp/promotion/strategy.json senju/state/strategy.json
          put_file /tmp/promotion/last-evolution-summary.json senju/state/last-evolution-summary.json
          put_file /tmp/promotion/last-evolution-plan.md senju/state/last-evolution-plan.md

          HEAD_SHA="$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq '.object.sha')"
          CURRENT_BASE_SHA="$(gh api "repos/$REPO/git/ref/heads/$BASE" --jq '.object.sha')"
          if [[ "$CURRENT_BASE_SHA" != "$BASE_SHA" ]]; then
            echo "Default branch moved during promotion; refusing stale fast-forward."
            gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" >/dev/null || true
            exit 1
          fi

          gh api "repos/$REPO/compare/$BASE_SHA...$HEAD_SHA" --jq '.files[].filename' | sort > /tmp/changed.txt
          python - <<'PY'
          from pathlib import Path
          allowed = {
              'senju/state/champion.json',
              'senju/state/strategy.json',
              'senju/state/last-evolution-summary.json',
              'senju/state/last-evolution-plan.md',
          }
          changed = {line.strip() for line in Path('/tmp/changed.txt').read_text().splitlines() if line.strip()}
          forbidden = changed - allowed
          if forbidden:
              raise SystemExit(f'promotion touched forbidden paths: {sorted(forbidden)}')
          if not changed:
              print('No state changed; nothing to promote.')
          else:
              print('Validated state-only diff:', ', '.join(sorted(changed)))
          PY

          if [[ "$HEAD_SHA" == "$BASE_SHA" ]]; then
            gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" >/dev/null || true
            echo "No state change; promotion not required."
            exit 0
          fi

          gh api -X PATCH "repos/$REPO/git/refs/heads/$BASE" -f sha="$HEAD_SHA" -F force=false >/dev/null
          gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" >/dev/null || true
          echo "Promoted validated Senju state to $BASE at $HEAD_SHA from run $GITHUB_RUN_ID"
