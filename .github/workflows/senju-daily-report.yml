name: Senju Daily Self Evolution

on:
  pull_request:
    branches: ["claude/employee-onboarding-setup-udm86"]
    paths:
      - "senju/**"
      - ".github/workflows/senju-daily-report.yml"
  workflow_dispatch:
    inputs:
      population:
        description: "各陣営の個体数"
        default: "120"
      generations:
        description: "世代数"
        default: "16"
      matches:
        description: "1世代あたりの対戦数"
        default: "400"
      candidates:
        description: "比較する改善候補数"
        default: "5"

permissions:
  contents: read
  actions: read

concurrency:
  group: senju-daily-self-evolution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evolve:
    name: Memory -> Tournament -> Eval -> Persist
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Restore previous champion memory
        run: |
          set -euo pipefail
          mkdir -p /tmp/senju-memory
          PREV_RUN="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "Senju Daily Self Evolution" \
            --status success \
            --limit 10 \
            --json databaseId \
            --jq '.[0].databaseId // empty' || true)"
          if [[ -n "$PREV_RUN" ]]; then
            gh run download "$PREV_RUN" \
              --repo "$GITHUB_REPOSITORY" \
              --name senju-memory \
              --dir /tmp/senju-memory || true
          fi
          if [[ -f /tmp/senju-memory/state.next.json ]]; then
            cp /tmp/senju-memory/state.next.json /tmp/senju-state.json
            echo "Restored durable champion memory from run $PREV_RUN"
          else
            cp senju/state/champion.json /tmp/senju-state.json
            echo "No prior artifact memory found; using repository bootstrap state"
          fi

      - name: Run engine and self-evolution tests
        working-directory: senju
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        run: |
          set -euo pipefail
          python -m pip install pytest==9.1.1
          python -m pytest tests -q

      - name: Verify isolation guard blocks public targets
        working-directory: senju
        run: |
          set -euo pipefail
          python -m senju.cli safety-check sim://ci-target
          if python -m senju.cli safety-check 8.8.8.8; then
            echo "SECURITY FAIL: public target was allowed" >&2
            exit 1
          fi
          if python -m senju.cli safety-check https://example.com; then
            echo "SECURITY FAIL: public URL was allowed" >&2
            exit 1
          fi

      - name: Run closed-loop candidate tournament
        id: evolve
        working-directory: senju
        env:
          POP: ${{ github.event.inputs.population || '120' }}
          GEN: ${{ github.event.inputs.generations || '16' }}
          MATCHES: ${{ github.event.inputs.matches || '400' }}
          CANDIDATES: ${{ github.event.inputs.candidates || '5' }}
        run: |
          set -euo pipefail
          python -m senju.autopilot \
            --state /tmp/senju-state.json \
            --out reports/evolution \
            --population "$POP" \
            --generations "$GEN" \
            --matches "$MATCHES" \
            --candidates "$CANDIDATES"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('reports/evolution/evolution-summary.json', encoding='utf-8'))
          if not d['selected']['safe']:
              raise SystemExit('selected evolution is not safe')
          print('accepted=' + str(d['accepted_strategy_change']).lower())
          print('score=' + str(d['selected']['score']))
          PY

      - name: Publish evolution report to job summary
        working-directory: senju
        run: |
          cat reports/evolution/evolution-plan.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n---\n' >> "$GITHUB_STEP_SUMMARY"
          cat reports/evolution/latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload durable memory for tomorrow
        id: memory
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: senju-memory
          retention-days: 30
          if-no-files-found: error
          path: |
            senju/reports/evolution/state.next.json
            senju/reports/evolution/strategy.next.json
            senju/reports/evolution/evolution-summary.json
            senju/reports/evolution/evolution-plan.md
            senju/reports/evolution/latest.json
            senju/reports/evolution/latest.md

      - name: Notify Slack
        if: always() && env.SLACK_WEBHOOK_URL != ''
        working-directory: senju
        env:
          JOB_STATUS: ${{ job.status }}
          ARTIFACT_URL: ${{ steps.memory.outputs.artifact-url }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          try:
              d=json.load(open('reports/evolution/evolution-summary.json', encoding='utf-8'))
              text=(
                  f"*Senju Daily Self Evolution* — {os.environ.get('JOB_STATUS')}\n"
                  f"safe={d['selected']['safe']} / score={d['selected']['score']} / "
                  f"strategy_change={d['accepted_strategy_change']}\n"
                  f"delta: {', '.join(d['changes'])}\n"
                  f"memory: {os.environ.get('ARTIFACT_URL','')}"
              )
          except Exception:
              text=f"*Senju Daily Self Evolution* — {os.environ.get('JOB_STATUS')}"
          req=urllib.request.Request(
              os.environ['SLACK_WEBHOOK_URL'],
              data=json.dumps({'text':text}).encode(),
              headers={'Content-Type':'application/json'},
          )
          with urllib.request.urlopen(req, timeout=10) as r:
              print('slack status', r.status)
          PY
