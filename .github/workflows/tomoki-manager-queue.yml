name: TOMOKI - MANAGER Queue Bridge

# Master Control recurrence guard: the policy-approved five-minute schedule is canonical.
# Realtime Kernel, THE CORE, and independent security workflows remain redundant wake paths
# so a dropped GitHub schedule cannot leave the canonical Manager heartbeat stale indefinitely.
# Offset the five-minute cadence to :02/:07/.../:57 to avoid GitHub's busiest hourly boundary.
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'THE WORLD - Realtime Kernel'
      - 'THE CORE - Autonomous Director'
      - 'Standment Security Scan'
      - 'Security Guard'
    types: [completed]
  push:
    branches: ['claude/employee-onboarding-setup-udm86']
    paths:
      - '.github/workflows/tomoki-manager-queue.yml'
      - 'automation/control_plane/manager_queue.py'

concurrency:
  group: tomoki-manager-queue
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  canonical-manager-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Fail closed on canonical schedule drift
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/tomoki-manager-queue.yml').read_text(encoding='utf-8')
          cron_lines = [line.strip() for line in workflow.splitlines() if line.strip().startswith('- cron:')]
          canonical = "- cron: '2-59/5 * * * *'"
          forbidden = "- cron: '*/5 * * * *'"
          if cron_lines.count(canonical) != 1:
              raise SystemExit('Manager schedule drift: canonical 2-59/5 cadence must appear exactly once')
          if forbidden in cron_lines:
              raise SystemExit('Manager schedule drift: hourly-boundary */5 cadence is forbidden')
          print('Manager schedule regression guard: PASS')

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Heartbeat and move up to three P100 Manager tasks into independent review
        run: |
          python automation/control_plane/manager_queue.py --max 3

      - name: Queue bridge summary
        if: always()
        run: |
          if [[ -f reports/control-plane/manager-queue-cycle.json ]]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('reports/control-plane/manager-queue-cycle.json',encoding='utf-8'))
          print('## TOMOKI / MANAGER canonical queue')
          print(f"- runtime: {d.get('runtime_id')}")
          print(f"- claimed_and_reviewed: {d.get('claimed_and_reviewed')}/{d.get('max_per_cycle')}")
          print('- final_self_approval: false')
          for row in d.get('tasks',[]):
              print(f"- {row.get('task_id')}: {row.get('risk_class')} -> {row.get('next_gate')} review={row.get('moved_to_review')}")
          PY
          else
            echo 'Manager queue cycle did not produce an evidence file.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Preserve manager queue evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tomoki-manager-queue-${{ github.run_id }}
          path: reports/control-plane/manager-queue-cycle.json
          retention-days: 30
          if-no-files-found: error
