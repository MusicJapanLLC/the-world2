name: THE WORLD Reality Agency

on:
  workflow_dispatch:
    inputs:
      resident_key:
        description: "Resident that initiated this reality mission"
        required: false
        default: ""
        type: string
      source_task_id:
        description: "The World ai_tasks id that initiated this mission"
        required: false
        default: ""
        type: string
  push:
    branches: ["claude/employee-onboarding-setup-udm86"]
    paths:
      - ".github/workflows/world-reality-agency.yml"
      - "outside-world/**"
      - "automation/world/external_feedback.py"
  schedule:
    - cron: '7,22,37,52 * * * *'

concurrency:
  group: the-world-reality-agency
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  issues: write
  id-token: write

env:
  GH_TOKEN: ${{ github.token }}
  GITHUB_TOKEN: ${{ github.token }}
  RND_SLACK_WEBHOOK_URL: ${{ secrets.RND_SLACK_WEBHOOK_URL }}
  CEO_REPORT_WEBHOOK_URL: ${{ secrets.CEO_REPORT_WEBHOOK_URL }}
  SUPABASE_URL: https://czwdtjgunsafcifjhpwt.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_vvPbYKjFFrc-OPM2yHFKaQ_9dtTu2EM

jobs:
  reality-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout THE WORLD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Restore reality memory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/reality-prev
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "THE WORLD Reality Agency" --status success --limit 8 --json databaseId --jq '.[0].databaseId // empty' || true)"
          if [[ -n "$RUN_ID" ]]; then
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name world-reality-agency-state --dir /tmp/reality-prev || true
          fi
          CURSOR="$(find /tmp/reality-prev -name reality-cursor.json -print -quit || true)"
          GATEWAY="$(find /tmp/reality-prev -name reality-gateway-state.json -print -quit || true)"
          if [[ -n "$CURSOR" ]]; then cp "$CURSOR" reality-cursor-previous.json; fi
          if [[ -n "$GATEWAY" ]]; then cp "$GATEWAY" reality-gateway-previous.json; fi
          echo "previous_run=${RUN_ID:-none}" >> "$GITHUB_STEP_SUMMARY"

      - name: Load canonical live population from Supabase
        shell: bash
        run: |
          set -euo pipefail
          python outside-world/supabase_directory.py --out world-citizens.json --require-min 100
          python outside-world/identity_manifest.py --citizens world-citizens.json --out world-identities.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('world-citizens.json', encoding='utf-8'))
          print(f"Canonical population: **{d.get('population', 0)}**")
          print("Identity source: **Supabase / world_reality_directory**")
          PY

      - name: Assign initiating resident or next citizens to the outside world
        env:
          INITIATING_RESIDENT: ${{ github.event.inputs.resident_key || '' }}
        run: |
          python outside-world/citizen_web_runtime.py \
            --citizens world-citizens.json \
            --previous reality-cursor-previous.json \
            --cycle "${{ github.run_id }}" \
            --resident-key "$INITIATING_RESIDENT" \
            --tasks reality-tasks.json \
            --state reality-cursor.json

      - name: Install Chromium research runtime
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Let citizens use a real browser
        run: |
          python outside-world/browser_runner.py \
            --tasks reality-tasks.json \
            --policy outside-world/reality_policy.json \
            --out reality-observations.json \
            --limit 24 \
            --parallel 6

      - name: Convert observations into owned-channel effects
        run: |
          python outside-world/reality_gateway.py \
            --observations reality-observations.json \
            --policy outside-world/reality_policy.json \
            --previous reality-gateway-previous.json \
            --report reality-field-report.md \
            --events reality-events.json \
            --state reality-gateway-state.json \
            --execute-owned-writes
          cat reality-field-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish successful field notes to non-GitHub public web
        env:
          PUBLIC_FEED_BOOTSTRAP_PROBE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[PUBLIC_FEED_PROBE]') }}
        run: |
          set -euo pipefail
          EXTRA_ARGS=()
          if [[ "$PUBLIC_FEED_BOOTSTRAP_PROBE" == "true" ]]; then
            EXTRA_ARGS+=(--probe)
          fi
          python outside-world/public_feed_bridge.py \
            --events reality-events.json \
            --out public-feed-receipt.json \
            --limit 2 \
            "${EXTRA_ARGS[@]}"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('public-feed-receipt.json', encoding='utf-8'))
          print(f"External public-feed mode: **{d.get('mode', 'REGULAR')}**")
          print(f"External public-feed writes selected: **{d.get('selected', 0)}**")
          for r in d.get('receipts', []):
              print(f"- {r.get('source_url', '')}: `{r.get('status')}` / `{(r.get('body') or {}).get('id', '')}`")
          PY

      - name: Convert real-world outcome into learning signal
        id: feedback
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          tasks=json.load(open('reality-tasks.json',encoding='utf-8'))
          obs=json.load(open('reality-observations.json',encoding='utf-8'))
          events=json.load(open('reality-events.json',encoding='utf-8'))
          receipts=json.load(open('public-feed-receipt.json',encoding='utf-8'))
          assigned=len(tasks.get('tasks') or [])
          observations=len(obs.get('observations') or obs.get('results') or [])
          effects=[e for e in (events.get('effects') or []) if isinstance(e.get('status'),int) and 200 <= e['status'] < 300]
          public=[r for r in (receipts.get('receipts') or []) if isinstance(r.get('status'),int) and 200 <= r['status'] < 300]
          metrics={'assigned_citizens':assigned,'observations':observations,'owned_effects':len(effects),'public_feed_writes':len(public),'external_effects_total':len(effects)+len(public)}
          evidence={'github_run_id':int(__import__('os').environ['GITHUB_RUN_ID']),'public_feed_receipts':public[:5],'owned_effects':effects[:10]}
          open('/tmp/reality-feedback-metrics.json','w',encoding='utf-8').write(json.dumps(metrics,ensure_ascii=False,indent=2)+'\n')
          open('/tmp/reality-feedback-evidence.json','w',encoding='utf-8').write(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n')
          effect=metrics['external_effects_total'] > 0
          signal=min(10.0, 1.0 + observations/8.0 + len(effects)*1.5 + len(public)*2.5)
          print('external_effect=' + ('true' if effect else 'false'))
          print('learning_signal=' + str(round(signal,3)))
          print('outcome=' + ('REAL_WORLD_EFFECT_VERIFIED' if effect else 'EXTERNAL_OBSERVATION_ONLY'))
          PY

      - name: Feed reality result back into THE WORLD
        shell: bash
        env:
          RESIDENT_KEY: ${{ github.event.inputs.resident_key || '' }}
          SOURCE_TASK_ID: ${{ github.event.inputs.source_task_id || '' }}
          REAL_EFFECT: ${{ steps.feedback.outputs.external_effect }}
          LEARNING_SIGNAL: ${{ steps.feedback.outputs.learning_signal }}
          REAL_OUTCOME: ${{ steps.feedback.outputs.outcome }}
        run: |
          set -euo pipefail
          EXTRA=""
          if [[ "$REAL_EFFECT" == "true" ]]; then EXTRA="--external-effect"; fi
          python automation/world/external_feedback.py record \
            --lane REALITY_AGENCY \
            --action-type public_web_observe_and_owned_publish \
            --resident-key "$RESIDENT_KEY" \
            --source-task-id "$SOURCE_TASK_ID" \
            --outcome "$REAL_OUTCOME" \
            --learning-signal "$LEARNING_SIGNAL" \
            --metrics /tmp/reality-feedback-metrics.json \
            --evidence /tmp/reality-feedback-evidence.json \
            --verified $EXTRA
          cat /tmp/reality-feedback-metrics.json >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve citizen identities, memory, evidence and effects
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: world-reality-agency-state
          retention-days: 30
          if-no-files-found: warn
          path: |
            world-citizens.json
            world-identities.json
            reality-tasks.json
            reality-cursor.json
            reality-observations.json
            reality-field-report.md
            reality-events.json
            reality-gateway-state.json
            public-feed-receipt.json
            /tmp/reality-feedback-metrics.json
            /tmp/reality-feedback-evidence.json
